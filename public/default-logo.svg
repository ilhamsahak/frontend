<!-- Default Magic Chess Tournament team logo — 1:1 SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1f5e"/>
      <stop offset="100%" stop-color="#0d0a2a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#f5c842" stroke-width="3" opacity="0.8"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#f5c842" stroke-width="1" opacity="0.3"/>
  <!-- Purple glow -->
  <circle cx="100" cy="100" r="80" fill="url(#glow)"/>

  <!-- Crown body -->
  <g filter="url(#goldglow)" fill="#f5c842">
    <!-- Crown base -->
    <rect x="58" y="110" width="84" height="14" rx="4"/>
    <!-- Crown peaks -->
    <polygon points="62,110 72,72 82,100 100,60 118,100 128,72 138,110"/>
    <!-- Crown gems -->
    <circle cx="72" cy="112" r="4" fill="#a78bfa"/>
    <circle cx="100" cy="112" r="4" fill="#c084fc"/>
    <circle cx="128" cy="112" r="4" fill="#a78bfa"/>
    <!-- Top gem -->
    <circle cx="100" cy="62" r="6" fill="#e879f9"/>
  </g>

  <!-- Sparkles -->
  <g fill="#f5c842" opacity="0.8">
    <polygon points="40,50 42,44 44,50 50,52 44,54 42,60 40,54 34,52" transform="scale(0.7) translate(10,10)"/>
    <polygon points="160,40 162,34 164,40 170,42 164,44 162,50 160,44 154,42" transform="scale(0.6)"/>
    <polygon points="155,155 157,149 159,155 165,157 159,159 157,165 155,159 149,157" transform="scale(0.55) translate(120,80)"/>
    <polygon points="30,160 32,154 34,160 40,162 34,164 32,170 30,164 24,162" transform="scale(0.5) translate(30,130)"/>
  </g>

  <!-- Stars -->
  <g fill="#c084fc" opacity="0.6">
    <circle cx="35" cy="75" r="2"/>
    <circle cx="165" cy="80" r="2"/>
    <circle cx="45" cy="140" r="1.5"/>
    <circle cx="158" cy="145" r="1.5"/>
  </g>
</svg>
